name: Quark Sign-in

on:
  schedule:
    - cron: '0 1 * * *'  # 每天 UTC 时间 1:00 执行，即北京时间 9:00
  workflow_dispatch:       # 手动触发

jobs:
  sign-in:
    runs-on: ubuntu-latest
    # 关键修改 1: 设置环境变量，强制提前启用 Node.js 24
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        # 关键修改 2: 升级到支持新Node.js版本的最新Action
        uses: actions/checkout@v5  # 从 v4 升级到 v5

      - name: Set up Python
        # 关键修改 2: 升级到支持新Node.js版本的最新Action
        uses: actions/setup-python@v6 # 从 v5 升级到 v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run Quark Sign-in
        env:
          COOKIE_QUARK: ${{ secrets.COOKIE_QUARK }}
        run: |
          python checkIn_Quark.py
